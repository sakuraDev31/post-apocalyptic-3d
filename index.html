<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
  <meta name="theme-color" content="#0e1014">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <title>Procedural 3D Asset Studio | Post-Apocalyptic Wasteland</title>
  <style>
    html, body {
      width: 100%;
      height: 100%;
      margin: 0;
      padding: 0;
      overflow: hidden;
      background-color: #0c0e12;
      user-select: none;
      -webkit-user-select: none;
      touch-action: none;
    }
    #loading-cover {
      position: fixed;
      inset: 0;
      background: #0c0e12;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      z-index: 9999;
      color: #ff9800;
      font-family: monospace;
      font-size: 14px;
      letter-spacing: 1px;
      transition: opacity 0.4s ease;
      pointer-events: none;
    }
    .loader-spinner {
      width: 36px;
      height: 36px;
      border: 3px solid rgba(255, 152, 0, 0.2);
      border-top-color: #ff9800;
      border-radius: 50%;
      animation: spin 0.8s linear infinite;
      margin-bottom: 16px;
    }
    @keyframes spin {
      to { transform: rotate(360deg); }
    }
  </style>
</head>
<body>
  <div id="loading-cover">
    <div class="loader-spinner"></div>
    <div>INITIALIZING 3D ASSET STUDIO...</div>
  </div>

  <script type="module" src="/src/main.js"></script>
  <script>
    window.addEventListener('load', () => {
      setTimeout(() => {
        const cover = document.getElementById('loading-cover');
        if (cover) {
          cover.style.opacity = '0';
          setTimeout(() => cover.remove(), 400);
        }
      }, 300);
    });
  </script>
</body>
</html>
