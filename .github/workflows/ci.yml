name: CI - Test & Build

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]
  workflow_dispatch:

jobs:
  test-and-build:
    name: Node ${{ matrix.node-version }} (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest]
        node-version: [20.x, 22.x]

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup Node.js ${{ matrix.node-version }}
        uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node-version }}
          cache: 'npm'

      - name: Install Dependencies
        run: npm ci

      - name: Run Test Suite (16 Unit & Integration Tests)
        run: npm test

      - name: Build Production Bundle (Vite)
        run: npm run build

      - name: Archive Production Artifacts
        if: matrix.node-version == '22.x' && github.ref == 'refs/heads/main'
        uses: actions/upload-artifact@v4
        with:
          name: post-apocalyptic-3d-dist
          path: dist/
          retention-days: 14
